[workspace]
resolver = "2"
members = [
    "crates/acpud-core",      # async primitives, simulation engine
    "crates/acpud-veryl",     # Veryl RTL codegen
    "crates/acpud-gui",       # visual designer (egui)
    "crates/acpud-cli",       # command-line interface
    "crates/acpud-sim",       # event-driven simulator
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/yourname/acpud"
homepage = "https://github.com/yourname/acpud"
description = "Design clockless CPUs. Visual + RTL async CPU designer built in Rust with Veryl."
keywords = ["async", "cpu", "clockless", "hdl", "eda"]
categories = ["hardware-support", "development-tools", "simulation"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
acpud-core  = { path = "crates/acpud-core" }
acpud-veryl = { path = "crates/acpud-veryl" }
acpud-sim   = { path = "crates/acpud-sim" }
acpud-gui   = { path = "crates/acpud-gui" }
acpud-cli   = { path = "crates/acpud-cli" }

# Shared external deps
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = "0.3"
petgraph    = "0.6"          # graph for async netlists
egui        = "0.27"
eframe      = "0.27"
clap        = { version = "4", features = ["derive"] }
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
